# ===================================================================
# CONFIGURACIÓN DEL SISTEMA DE CONTEO CÍCLICO - MARATHON ATOCONGO
# ===================================================================

# Puerto de la aplicación
server.port=8080

# Nombre de la aplicación
spring.application.name=marathon-inventario-atocongo

# ===================================================================
# BASE DE DATOS MYSQL SERVER 8.0 (ACTIVA CON PERSISTENCIA REAL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/marathon_inventario?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE PARA MYSQL
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SWAGGER / OPENAPI 3 (Documentación interactiva)
# ===================================================================
# Accede a: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
